name: CI

# Runs the same gate as TESTING.md "Before you say done" on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19; switch deliberately once Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # node:sqlite + native TypeScript stripping
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Known security problems in what the site runs on (high or critical)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # The end-to-end suite (incl. the axe accessibility sweep) in two halves at once, about 13 minutes each
  # instead of one 25-minute run. Each job starts all three test servers; the halves split the projects.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - half: a
            projects: --project=seeded --project=empty --project=firefox --project=webkit
            browsers: chromium firefox webkit
          - half: b
            projects: --project=seeded-2
            browsers: chromium
    name: e2e (${{ matrix.half }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      - run: npm run build
      - run: npx playwright test ${{ matrix.projects }}

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.half }}
          path: web/test-results/
          retention-days: 7

  # The production rehearsal (TESTING.md): the real deployment kit in deploy/ — Docker image, scheduler,
  # Caddy with HTTPS — started from nothing and checked end to end. Catches deployment-only problems
  # (like headers fixed at build time) that the e2e servers, on plain http, can't see. On both kinds of
  # processor: ARM is what Oracle Cloud's free servers use (deploy/ORACLE-FREE.md).
  rehearsal:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run rehearsal

      # The image the rehearsal built, scanned for known security problems: a high or critical one that
      # already has a fix fails the job (rebuild on a newer base image, or update the package).
      - name: Scan the image (Trivy)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 questboard-app

      - name: Upload rehearsal traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rehearsal-traces-${{ matrix.runner }}
          path: web/test-results/
          retention-days: 7

  # A busy evening on the smallest setup (npm run load-rehearsal): no errors, no overbooking, memory
  # under the caps. Its own job, so it runs alongside the rehearsals instead of after one.
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run load-rehearsal -- --users 100 --seconds 90

  # The ready-made image (deploy/README.md, "Small servers"): after every green push to main, the
  # production image is built on both processors and published as one multi-platform image, so a small
  # server downloads it instead of building (a Next.js build needs more memory than a 1 GB server has).
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, e2e, rehearsal, load]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: web
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/quest-board,push-by-digest=true,name-canonical=true,push=true
      - name: Remember the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  image-publish:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish :latest and :<commit> for both processors
        working-directory: /tmp/digests
        run: |
          IMAGE="ghcr.io/${OWNER,,}/quest-board"
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"
        env:
          OWNER: ${{ github.repository_owner }}
