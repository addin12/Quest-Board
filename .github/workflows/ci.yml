name: CI

# Runs the same gate as TESTING.md "Before you say done" on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19; switch deliberately once Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # node:sqlite + native TypeScript stripping
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Install Playwright browsers (Chromium; Firefox and WebKit for the cross-browser journeys)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build + end-to-end (incl. axe accessibility sweep)
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  # The production rehearsal (TESTING.md): the real deployment kit in deploy/ — Docker image, scheduler,
  # Caddy with HTTPS — started from nothing and checked end to end. Catches deployment-only problems
  # (like headers fixed at build time) that the e2e servers, on plain http, can't see.
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run rehearsal

      - name: Upload rehearsal traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rehearsal-traces
          path: web/test-results/
          retention-days: 7
