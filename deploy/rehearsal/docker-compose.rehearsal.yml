# The production rehearsal (npm run rehearsal in web/): the real kit, on this machine, on
# https://localhost:8443 with Caddy's local certificate. Used with docker-compose.yml:
#   QUESTBOARD_ENV_FILE=rehearsal/rehearsal.env docker compose -p qb-rehearsal -f docker-compose.yml -f rehearsal/docker-compose.rehearsal.yml up -d --build
services:
  caddy:
    ports: !override
      - "8080:80"
      - "8443:443"

  # Stand-ins for Resend and S3-compatible storage (scripts/rehearsal-fakes.mjs), so the rehearsal can
  # follow sign-up emails and off-site backups. Only here — never in a real deployment.
  fakes:
    build: ../web
    env_file: rehearsal/rehearsal.env
    command: ["node", "scripts/rehearsal-fakes.mjs"]
    healthcheck:
      disable: true
    ports:
      - "4000:4000"
